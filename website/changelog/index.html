    <!-- Apply the saved theme before first paint, so there is no flash.
         Light is the default; only "light" and "dark" are valid values. -->
    <script>
      (function () {
        var theme = "light";
        try {
          if (localStorage.getItem("tread-theme") === "dark") theme = "dark";
        } catch (e) {}
        var root = document.documentElement;
        root.classList.toggle("dark", theme === "dark");
        root.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#06080f" : "#f7f8fc");
      })();
    </script>

    <!-- The page is prerendered, so it reads fine without JavaScript. Scroll
         animations start transparent; without JavaScript they never run, so
         show that content as it is. -->
    <noscript>
      <style>
        #root [style*="opacity"] {
          opacity: 1 !important;
          transform: none !important;
