# AURA continuous integration (CI). Release packaging: ADR-0008.
#
# The default branch is assumed to be `main` (the repository's configured
# branch at the time this workflow was written).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          # There is no go.sum (no dependencies); key the build cache on go.mod.
          cache-dependency-path: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build
        run: go build ./...

      # Repeats the checks above from the build and test caches (fast) and
      # adds the `aura run` smoke test, proving the local gate equals CI.
      - name: scripts/verify.sh
        run: bash scripts/verify.sh

  release-build:
    name: release build (cross-compile, reproducibility)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Build all release targets
        run: DIST_DIR=dist bash scripts/build-release.sh

      - name: Rebuild and compare checksums (reproducibility)
        run: |
          DIST_DIR=dist-again bash scripts/build-release.sh
          diff dist/SHA256SUMS dist-again/SHA256SUMS

      - name: Upload release archives
        uses: actions/upload-artifact@v7
        with:
          name: aura-release
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # Runs every release archive on its own operating system and CPU
  # architecture (cross-compilation alone does not prove a binary runs).
  release-smoke:
    name: release smoke (${{ matrix.target }})
    needs: release-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux_amd64, os: ubuntu-latest, ext: tar.gz, exe: aura }
          - { target: linux_arm64, os: ubuntu-24.04-arm, ext: tar.gz, exe: aura }
          - { target: darwin_arm64, os: macos-latest, ext: tar.gz, exe: aura }
          - { target: darwin_amd64, os: macos-15-intel, ext: tar.gz, exe: aura }
          - { target: windows_amd64, os: windows-latest, ext: zip, exe: aura.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          name: aura-release
          path: dist

      - name: Verify checksums
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi

      - name: Extract and smoke-test the binary
        run: |
          version=$(sed -n 's/^var Version = "\(.*\)"$/\1/p' internal/cli/version.go)
          name="aura_${version}_${{ matrix.target }}"
          mkdir -p extracted
          if [ "${{ matrix.ext }}" = zip ]; then
            # The documented Windows install step (README); `unzip` is not
            # listed in the windows-latest runner image, PowerShell 7 is.
            pwsh -NoProfile -Command "Expand-Archive -LiteralPath 'dist/${name}.zip' -DestinationPath 'extracted'"
          else
            tar -xzf "dist/${name}.tar.gz" -C extracted
          fi
          for f in LICENSE README.md CHANGELOG.md THIRD_PARTY_NOTICES.txt; do
            test -f "extracted/${name}/$f"
          done
          bash scripts/smoke-release.sh "extracted/${name}/${{ matrix.exe }}" "$version"
