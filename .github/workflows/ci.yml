# AURA continuous integration (docs/13-mvp-hardening.md, "CI").
#
# The default branch is assumed to be `main` (the repository's configured
# branch at the time this workflow was written).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          # There is no go.sum (no dependencies); key the build cache on go.mod.
          cache-dependency-path: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go build
        run: go build ./...

      # Repeats the checks above from the build and test caches (fast) and
      # adds the `aura run` smoke test, proving the local gate equals CI.
      - name: scripts/verify.sh
        run: bash scripts/verify.sh

  release-build:
    name: release build (cross-compile, reproducibility)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Build all release targets
        run: DIST_DIR=dist bash scripts/build-release.sh

      - name: Rebuild and compare checksums (reproducibility)
        run: |
          DIST_DIR=dist-again bash scripts/build-release.sh
          diff dist/SHA256SUMS dist-again/SHA256SUMS

      - name: Smoke-test the linux/amd64 binary
        run: |
          version=$(sed -n 's/^var Version = "\(.*\)"$/\1/p' internal/cli/version.go)
          bin="dist/aura-${version}-linux-amd64"
          test "$("$bin" version)" = "aura ${version}"
          test "$("$bin" run examples/hello.aura)" = "Hello, AURA!"
